<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <meta charset="UTF-8">
    <title>Plant Monitoring Dashboard</title>

</head>
<body>

<h1>Plant Monitoring Dashboard</h1>

<!-- SENSOR DATA -->
<div class="card">
    <h2>Live Sensor Data</h2>
    <p><span class="label">Temperature:</span> <span id="temp">--</span> °C</p>
    <p><span class="label">Humidity:</span> <span id="hum">--</span> %</p>
    <p><span class="label">Pressure:</span> <span id="pres">--</span> hPa</p>
</div>

<!-- ALERT STATES -->
<div class="card">
    <h2>Alert Status</h2>

    <p>Temp Low: <span id="v1" class="ok">0</span></p>
    <p>Temp High: <span id="v2" class="ok">0</span></p>
    <p>Humidity Low: <span id="v3" class="ok">0</span></p>
    <p>Humidity High: <span id="v4" class="ok">0</span></p>
    <p>Motion: <span id="v5" class="ok">0</span></p>
    <p>Suppression Active: <span id="v6" class="ok">0</span></p>

    <p><span class="label">Latest Alert:</span> <span id="alert">None</span></p>
</div>

<!-- CAMERA IMAGE -->
<div class="card">
    <h2>Latest Camera Image</h2>
    <img id="cam" src="/latest.jpg" alt="Latest Image">
</div>

<script>
function updateDashboard() {
    fetch("/data")
        .then(response => response.json())
        .then(data => {
            // Sensor values
            document.getElementById("temp").innerText = data.temperature ?? "--";
            document.getElementById("hum").innerText = data.humidity ?? "--";
            document.getElementById("pres").innerText = data.pressure ?? "--";

            // Alerts
            document.getElementById("v1").innerText = data.temp_low;
            document.getElementById("v2").innerText = data.temp_high;
            document.getElementById("v3").innerText = data.hum_low;
            document.getElementById("v4").innerText = data.hum_high;
            document.getElementById("v5").innerText = data.motion;
            document.getElementById("v6").innerText = data.suppression;

            // Latest alert text
            document.getElementById("alert").innerText = data.alert ?? "None";

            // Force-refresh camera image (cache-bypass)
            document.getElementById("cam").src = "/latest.jpg?t=" + new Date().getTime();
        });
}

// Refresh every 1.5 seconds
setInterval(updateDashboard, 1500);
updateDashboard();
</script>

</body>
</html>
